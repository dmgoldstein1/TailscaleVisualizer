name: secret-scan

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for secrets
        run: bash scripts/check-no-secrets.sh
